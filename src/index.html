<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Spots is a image-sharing platform where users share, and interact through photo moments.">
  <meta name="author" content="Rafael A">
  <meta name="keywords" content="html, css">
  <title>Spots</title>
</head>

<body>
  <div class="page">
    <header class="header">
      <img src="./images/logo.svg" alt="Spot logo" class="header__logo">
    </header>
    <main class="content">
      <section class="page__section profile">
        <div class="profile__avatar-container">
          <img src="./images/avatar.jpg" alt="user avatar" class="profile__avatar">
          <button type="button" class="profile__avatar-edit-button" id="avatar-edit-button">
            <span><img src="./images/edit-icon.svg" alt="edit avatar"> Edit Avatar</span>
          </button>
        </div>

        <div class="profile__column">
          <h1 class="profile__name">Bessie Coleman</h1>
          <p class="profile__description">Civil Aviator</p>
          <button class="profile__edit-button" id="edit-profile-button">
            <img src="./images/edit-icon.svg" alt="edit icon">
            Edit Profile
          </button>
        </div>
        <button type="button" class="profile__add-button" id="new-post-button">
          <img src="./images/plus-icon.svg" alt="edit icon">
          New Post
        </button>
      </section>
      <section class="cards page__section">
        <ul class="cards__list">
          <template id="card-template">
            <li class="card">
              <button class="card__delete-button" type="button"></button>
              <img src="#" alt="" class="card__image">
              <div class="card__content">
                <h2 class="card__title"></h2>
                <button type="button" class="card__like-button" aria-label="Like this card"></button>
              </div>
            </li>
          </template>
        </ul>
      </section>
    </main>
    <footer class="footer">
      <h2 class="footer__title">2024 © Spots</h2>
    </footer>
    <div class="modal" id="modal__edit-profile">
      <div class="modal__content">
        <button type="button" class="modal__close-btn">
        </button>
        <h2 class="modal__title">Edit Profile</h2>
        <form class="modal__form" id="edit-profile-form" novalidate>
          <label for="profile-name-input" class="modal__label">
            Name
            <input required id="profile-name-input" type="text" class="modal__input" placeholder="Type your name"
              minlength="2" maxlength="40">
            <span id="profile-name-input-error" class="modal__span-error"></span>
          </label>
          <label for="profile-description-input" class="modal__label">
            Description
            <input required id="profile-description-input" type="text" class="modal__input"
              placeholder="Describe your self" minlength="2" maxlength="200">
            <span id="profile-description-input-error" class="modal__span-error"></span>
          </label>
          <button type="submit" class="modal__submit-btn">Save</button>
        </form>
      </div>
    </div>

    <div class="modal" id="modal__new-post">
      <div class="modal__content">
        <button type="button" class="modal__close-btn">
        </button>
        <h2 class="modal__title">New post</h2>
        <form class="modal__form" id="new-post-form" novalidate>
          <label for="profile-image-input" class="modal__label">
            Image link
            <input required id="profile-image-input" type="url" class="modal__input"
              placeholder="Paste a link to the picture">
            <span id="profile-image-input-error" class="modal__span-error"></span>
          </label>
          <label for="profile-caption-input" class="modal__label">
            Caption
            <input required id="profile-caption-input" type="text" class="modal__input" placeholder="Type your caption"
              minlength="2" maxlength="30">
            <span id="profile-caption-input-error" class="modal__span-error"></span>
          </label>
          <button type="submit" class="modal__submit-btn">Save</button>
        </form>
      </div>
    </div>

    <div class="modal modal_type_preview " id="preview-modal">
      <div class="modal__image-container">
        <button class="modal__close-btn modal__close-btn_type_preview"></button>
        <img src="#" alt="" class="modal__image">
        <p class="modal__caption"></p>
      </div>
    </div>

    <div class="modal" id="modal__delete-card">
      <div class="modal__content">
        <button type="button" class="modal__close-btn delete-popup__close-btn">
        </button>
        <h2 class="delete-popup__title">Are you sure you want to delete this image?</h2>
        <div class="delete-popup__button-group">
          <button type="button" class="modal__submit-btn delete-popup__submit-btn_type_delete">Delete</button>
          <button type="button" class="modal__submit-btn delete-popup__submit-btn_type_cancel">Cancel</button>
        </div>
      </div>
    </div>

    <div class="modal" id="modal__update-avatar">
      <div class="modal__content">
        <button type="button" class="modal__close-btn">
        </button>
        <h2 class="modal__title">Edit profile avatar</h2>
        <form class="modal__form" id="update-avatar-form" novalidate>
          <label for="avatar-url-input" class="modal__label">
            Image link
            <input required id="avatar-url-input" type="url" class="modal__input"
              placeholder="Paste a link to the new avatar">
            <span id="avatar-url-input-error" class="modal__span-error"></span>
          </label>
          <button type="submit" class="modal__submit-btn">Save</button>
        </form>
      </div>
    </div>
  </div>
</body>

</html>
